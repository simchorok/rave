<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>RAVE Halle 01</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-bleed 3D stage, thin bone-white HUD pinned to the corners, entry gate overlay. Single dark look on purpose (abandoned hall at night). */
:root{
  --ink:#0a0807; --bone:#ece6dc; --dim:#958c80; --ember:#ff6a1a;
  --panel:rgba(14,11,9,.74); --line:rgba(236,230,220,.16);
  --f-display:'Big Shoulders Display',Impact,'Arial Narrow',sans-serif;
  --f-body:'IBM Plex Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
/* loading screen: covers everything until the mannequin and its thumbnails are ready */
#loader{position:fixed;inset:0;z-index:100;background:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .7s}
#loader.out{opacity:0;pointer-events:none}
#loader b{font-family:var(--f-display);font-weight:900;font-size:clamp(64px,14vw,150px);line-height:.85;letter-spacing:.06em;color:var(--bone);animation:lpulse 1.6s ease-in-out infinite}
@keyframes lpulse{50%{opacity:.45}}
.lbar{width:min(260px,62vw);height:3px;background:rgba(236,230,220,.12);overflow:hidden}
.lbar i{display:block;height:100%;width:0;background:#e0201a;transition:width .25s}
#lpct{font-family:var(--f-mono);font-size:12px;letter-spacing:.2em;color:var(--dim)}
@media (prefers-reduced-motion:reduce){#loader b{animation:none}}
html,body{height:100%;margin:0;background:var(--ink);color:var(--bone);overflow:hidden;font-family:var(--f-body);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#flash{position:fixed;inset:0;background:#fff3e2;opacity:0;pointer-events:none;mix-blend-mode:screen}
[hidden]{display:none!important}
body[data-theme=desert] .hud{text-shadow:0 1px 8px rgba(40,24,8,.7)} /* HUD text stays readable on bright sand */
#dusthaze{position:fixed;inset:0;pointer-events:none;opacity:0;background:linear-gradient(rgba(230,180,120,.55),rgba(205,140,80,.8))} /* beige veil when the wind kicks up sand */
#glare{position:fixed;inset:0;pointer-events:none;mix-blend-mode:screen;
  --gx:50%;--gy:-80%;background:radial-gradient(circle at var(--gx) var(--gy),rgba(255,255,248,1) 0,rgba(255,252,232,.85) 6%,rgba(255,246,215,.35) 20%,rgba(255,246,215,0) 45%),
    radial-gradient(ellipse 140% 60% at 50% -22%,rgba(255,255,250,.35) 0,rgba(255,250,228,.15) 35%,rgba(255,246,218,0) 70%)}
#glare::after{content:"";position:absolute;inset:-10% -20%;background:repeating-linear-gradient(98deg,rgba(255,255,242,0) 0 50px,rgba(255,255,242,.16) 75px,rgba(255,255,242,0) 110px);
  -webkit-mask-image:linear-gradient(#000,transparent 75%);mask-image:linear-gradient(#000,transparent 75%);animation:rays 14s linear infinite} /* sun rays beating down */
@keyframes rays{to{transform:translateX(110px)}}
@media (prefers-reduced-motion:reduce){#glare::after{animation:none}}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay}

.hud{position:fixed;z-index:5;pointer-events:none}
.hud *{pointer-events:auto}
#top{top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.room{display:flex;flex-direction:column;gap:2px;pointer-events:none}
.room b{font-family:var(--f-display);font-weight:900;font-size:30px;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.room span{font-family:var(--f-mono);font-size:11px;color:var(--dim);letter-spacing:.08em;text-transform:uppercase;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--bone)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#cam{width:168px;aspect-ratio:4/3;max-width:38vw;border:1px solid var(--line);background:#000;position:relative}
#cam canvas{width:100%;height:100%;display:block}
#cam small{position:absolute;left:6px;bottom:4px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;color:var(--bone);text-shadow:0 1px 2px #000}

#meter{left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
#meter .bar{width:8px;height:150px;border:1px solid var(--line);position:relative;background:rgba(0,0,0,.4)}
#meter .fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,#7a1a06,#ff6a1a 55%,#ffd48a)}
#meter label{writing-mode:vertical-rl;transform:rotate(180deg);font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--dim)}

#bottom{left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pad{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(2,44px);gap:4px}
.pad button{background:var(--panel);border:1px solid var(--line);color:var(--bone);font-size:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.pad button:active,.pad button.on{background:var(--bone);color:var(--ink)}
.pad .up{grid-column:2}
.pad .lt{grid-column:1;grid-row:2}.pad .dn{grid-column:2;grid-row:2}.pad .rt{grid-column:3;grid-row:2}
.joy{position:fixed;z-index:30;width:110px;height:110px;margin:-55px 0 0 -55px;border:1px solid rgba(236,230,220,.35);border-radius:50%;background:rgba(0,0,0,.25);pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:rgba(236,230,220,.55)}
@media (pointer:coarse){.pad{display:none}.keys .pc{display:none}}@media (pointer:fine){.keys .touch{display:none}}
.keys{font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:.08em;margin-top:6px}
.ctrl{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.btn{font:500 12px/1 var(--f-body);color:var(--bone);background:var(--panel);border:1px solid var(--line);padding:10px 12px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.btn:hover{border-color:var(--bone)}
.btn:focus-visible,.go:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.btn .dot{width:6px;height:6px;border-radius:50%;background:var(--dim)}
.btn[aria-pressed="true"] .dot{background:var(--ember);box-shadow:0 0 8px var(--ember)}

#toast{position:fixed;left:50%;top:calc(80px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:9;background:var(--bone);color:var(--ink);
  font-size:13px;line-height:1.5;font-weight:500;padding:10px 14px;width:max-content;max-width:calc(100% - 32px);opacity:0;transition:opacity .25s;pointer-events:none}
#toast.show{opacity:1}

/* entry gate: game title screen. Near-black over the live hall, huge centred title, short dock at the bottom */
#gate{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;overflow:auto;text-align:center;
  background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,.82),rgba(0,0,0,.97) 70%);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.title{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:min(40vh,340px)}
.title h1{position:relative;margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(84px,17vw,240px);line-height:.85;letter-spacing:.06em;white-space:nowrap;
  color:var(--bone);text-shadow:-3px 0 rgba(255,30,30,.55),3px 0 rgba(60,200,255,.35),0 0 60px rgba(255,255,255,.08);animation:titleIn 1.4s cubic-bezier(.2,.7,.2,1) both}
.title h1 em{font-style:normal;color:#e0201a;text-shadow:-3px 0 rgba(255,60,40,.6),3px 0 rgba(60,200,255,.25),0 0 40px rgba(224,32,26,.7)}
/* .grit (set by JS): speckled, worn spray-paint texture clipped to the letters; drop-shadow keeps the colour fringe without filling the holes */
.title h1.grit,.title h1.grit em{color:transparent;text-shadow:none;background-repeat:repeat;background-size:220px;-webkit-background-clip:text;background-clip:text}
.title h1.grit{background-image:var(--grit-bone);filter:drop-shadow(-3px 0 rgba(255,30,30,.45)) drop-shadow(3px 0 rgba(60,200,255,.22))}
.title h1.grit em{background-image:var(--grit-red)}
.tags{margin:0;font-family:var(--f-mono);font-weight:500;font-size:clamp(11px,1.3vw,14px);letter-spacing:.14em;color:var(--dim);animation:fadeUp .8s .5s both}
.tagline{margin:4px 0 0;font-family:var(--f-mono);font-weight:700;font-size:clamp(17px,2.2vw,24px);letter-spacing:.14em;animation:fadeUp .8s .75s both}
.dock{width:100%;max-width:560px;display:flex;flex-direction:column;align-items:center;gap:16px;animation:fadeUp .8s 1s both}
.tip{font-size:13px;line-height:1.7;color:#bdb5aa;word-break:keep-all}
.tip b{display:inline-block;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:#e0201a;margin-bottom:4px}
.tip p{margin:0}
.gobox{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.go{font:700 16px/1.2 var(--f-body);letter-spacing:.02em;padding:17px 14px;cursor:pointer;border:1px solid var(--bone);transition:background .15s,color .15s,border-color .15s,transform .15s}
.go.primary{background:var(--bone);color:var(--ink)}
.go.ghost{background:rgba(0,0,0,.4);color:var(--bone)}
.go:not(:disabled):hover{background:#e0201a;border-color:#e0201a;color:#fff;transform:translateY(-1px)}
.go:disabled{opacity:.3;cursor:not-allowed}
/* character picker: gender toggle + 4 looks with rendered thumbnails; entering needs a pick */
.pick{width:100%;display:flex;flex-direction:column;align-items:center;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{font:700 13px/1 var(--f-body);padding:9px 24px;background:transparent;color:var(--dim);border:0;cursor:pointer}
.seg button.on{background:var(--bone);color:var(--ink)}
.looks{flex:1;min-width:0;display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:4px 0}.looks::-webkit-scrollbar{display:none}
.looks::before,.looks::after{content:'';flex:0 0 calc(50% - 75px)} /* spacers so the first and last card can sit in the middle */
.looks .look{flex:0 0 150px;font-size:13px;scroll-snap-align:center;opacity:.55;transform:scale(.88);transition:border-color .15s,background .15s,opacity .2s,transform .2s}.looks .look.mid{opacity:1;transform:none}
.look{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 4px 8px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--bone);font:500 11px/1.3 var(--f-body);cursor:pointer;transition:border-color .15s,background .15s;word-break:keep-all}
.look img{width:100%;max-width:150px;aspect-ratio:3/4;object-fit:contain}
.look i{width:52px;aspect-ratio:3/4;border-radius:40% 40% 8px 8px;display:block;opacity:.75}
.look:hover{border-color:rgba(236,230,220,.4)}
.look.on{border-color:#e0201a;background:rgba(224,32,26,.14)}
.look:focus-visible,.seg button:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
#pickhint{margin:0;font-size:12px;color:var(--dim)}
#sndbtn{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:12;width:44px;height:44px;display:grid;place-items:center;font-size:20px;line-height:1;border:0;background:none;color:var(--bone);cursor:pointer;transition:transform .15s}
#sndbtn:hover{transform:scale(1.1)}
#sndbtn:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
@keyframes pulseHint{50%{opacity:.45}}
#gate.out{opacity:0;transition:opacity .9s ease;pointer-events:none}
/* entry steps: 1 = theme carousel (cards snap to centre, neighbours peek in), 2 = character pick with a compact title */
.step{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;animation:fadeUp .5s both}
.carousel{width:100%;display:flex;align-items:center;gap:8px}
.track{flex:1;min-width:0;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding:4px 7%;scroll-padding:0 7%}
.track::-webkit-scrollbar{display:none}
.theme{flex:0 0 86%;scroll-snap-align:center;position:relative;aspect-ratio:16/9;min-height:150px;border:1px solid var(--line);cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:16px 18px;text-align:left;color:var(--bone);overflow:hidden;font:inherit;transition:border-color .2s,transform .2s,opacity .2s}
.theme::after{content:"";position:absolute;inset:0;background:radial-gradient(130% 90% at 50% 40%,transparent 50%,rgba(0,0,0,.65));pointer-events:none}
.theme>*{position:relative;z-index:1}
.theme .no{position:absolute;top:12px;left:16px;font-family:var(--f-mono);font-size:11px;letter-spacing:.2em;color:var(--dim)}
.theme .badge{position:absolute;top:10px;right:12px;font:700 11px/1 var(--f-body);padding:5px 8px;border:1px solid var(--line);color:var(--dim);background:rgba(0,0,0,.45)}
.theme h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:clamp(36px,7vw,58px);line-height:.95;letter-spacing:.05em}
.theme h2,.theme .sub{text-shadow:0 1px 14px rgba(0,0,0,.6)}
.theme .sub{margin:8px 0 0;font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;color:#d6cdc1;word-break:keep-all}
.theme.ready .badge{background:#e0201a;border-color:#e0201a;color:#fff}
.theme.ready:hover{border-color:#e0201a}
.theme.soon{cursor:default}
.theme.soon h2{color:rgba(236,230,220,.4)}
.theme.soon::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 9px);pointer-events:none}
.theme.shake{animation:shake .35s}
.theme:focus-visible,.nav:focus-visible,.back:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.nav{flex:0 0 auto;width:40px;height:40px;border:1px solid var(--line);background:rgba(0,0,0,.4);color:var(--bone);font-size:22px;line-height:1;cursor:pointer}
.nav:disabled{opacity:.2;cursor:default}
.dots{display:flex;gap:7px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(236,230,220,.25);transition:background .2s}.dots i.on{background:#e0201a}
#themehint{margin:0;font-size:12px;color:var(--dim)}
.chosenbar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.back{background:none;border:0;color:var(--dim);font:500 12px var(--f-body);cursor:pointer;padding:4px 0}
.back:hover{color:var(--bone)}
.chosen{margin:0;font-size:11px;font-family:var(--f-mono);letter-spacing:.06em;color:var(--dim)}
.chosen b{font-family:var(--f-display);font-weight:900;font-size:20px;letter-spacing:.05em;color:var(--bone);margin-right:8px}
#gate[data-step=theme] .dock{max-width:820px}
#gate[data-step=look] .title{flex:0 0 auto;min-height:0;padding:min(4vh,32px) 0 18px}
#gate[data-step=look] .title h1{font-size:clamp(64px,13vw,170px)}
#gate[data-step=look] .tagline{font-family:var(--f-mono);font-weight:500;font-size:clamp(11px,1.3vw,14px);letter-spacing:.12em;color:var(--dim)}
@media (max-width:460px){.nav{display:none}.track{padding:4px 5%}.theme{flex-basis:90%}}
@media (max-width:600px){#gate[data-step=theme] .title h1{font-size:38vw;letter-spacing:.02em}#sndbtn{width:56px;height:56px;font-size:32px}.theme{aspect-ratio:4/3}.theme h2{font-size:clamp(46px,14vw,60px)}.theme .sub{font-size:14px;line-height:1.5}
  #gate[data-step=look] .title{padding-top:58px}#gate[data-step=look] .title h1{font-size:21vw}#gate[data-step=look] .tagline{font-size:13px}
  .back{font-size:14px}.tip{font-size:15px}.tip b{font-size:12px}.seg button{font-size:15px;padding:11px 30px}
  .looks::before,.looks::after{flex-basis:calc(50% - 80px)}.looks .look{flex-basis:160px}.look{font-size:14px;padding:8px 4px 10px}.look img{max-width:none}.look i{width:70%}
  #pickhint{font-size:13px}.go{font-size:18px;padding:19px 14px}.warn{font-size:13px}} /* phones: RAVE fills the width */
.warn{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);cursor:pointer}
.warn b{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--ember);margin-right:4px}
@keyframes titleIn{0%{opacity:0;transform:scale(1.08);filter:blur(10px)}55%{opacity:1;filter:blur(0)}62%{opacity:.55}68%{opacity:1}100%{transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.title h1,.tags,.tagline,.dock{animation:none}}
@media (max-width:460px){.gobox{grid-template-columns:1fr}#cam{width:120px}.room b{font-size:24px}.tip br{display:none}}
</style>

<div id="stage"></div>
<canvas id="grain" width="160" height="160"></canvas>
<div id="flash"></div>
<div id="glare" hidden></div>
<div id="dusthaze" hidden></div>

<div class="hud" id="top" hidden>
  <div class="room">
    <b>Halle 01</b>
    <span><span class="live"><i></i>LIVE</span><span id="bpm">155 BPM</span><span>16 RAVERS</span></span>
  </div>
  <div id="cam" hidden><canvas id="camc" width="320" height="240"></canvas><small id="camlbl">TRACKING</small></div>
</div>

<div class="hud" id="meter" hidden><label>ENERGY</label><div class="bar"><div class="fill" id="fill"></div></div></div>

<div class="hud" id="bottom" hidden>
  <div>
    <div class="pad">
      <button class="up" data-k="f" aria-label="앞으로">▲</button>
      <button class="lt" data-k="l" aria-label="왼쪽">◀</button>
      <button class="dn" data-k="b" aria-label="뒤로">▼</button>
      <button class="rt" data-k="r" aria-label="오른쪽">▶</button>
    </div>
    <div class="keys"><span class="pc">WASD / 방향키로 이동 · 드래그로 시점 회전</span><span class="touch">왼쪽 화면을 끌어서 이동 · 오른쪽은 시점 회전</span></div>
  </div>
  <div class="ctrl">
    <button class="btn" id="bMode" aria-pressed="false"><span class="dot"></span><span id="bModeT">모션 모드</span></button>
    <button class="btn" id="bStrobe" aria-pressed="true"><span class="dot"></span>섬광효과</button>
    <button class="btn" id="bMute" aria-pressed="false"><span class="dot"></span>음소거</button>
  </div>
</div>

<div id="loader" role="status" aria-live="polite"><b>RAVE</b><div class="lbar"><i id="lfill"></i></div><small id="lpct">LOADING</small></div>

<div id="toast" role="status"></div>

<div id="gate" data-step="theme">
  <button id="sndbtn" aria-pressed="false" aria-label="사운드 켜기" title="사운드 켜기">🔇</button>
  <div class="title">
    <h1>RAVE</h1>
    <p class="tagline">미친 세상의 생존자들</p>
  </div>
  <div class="dock">
    <!-- step 1: pick a theme (slide left/right) -->
    <section class="step" id="stepTheme" aria-label="테마 선택">
      <div class="carousel">
        <button class="nav" id="thPrev" aria-label="이전 테마">‹</button>
        <div class="track" id="themeTrack"></div>
        <button class="nav" id="thNext" aria-label="다음 테마">›</button>
      </div>
      <div class="dots" id="themeDots"></div>
      <p id="themehint">테마를 골라주세요</p>
    </section>
    <!-- step 2: pick a character, then enter -->
    <section class="step" id="stepLook" hidden>
      <div class="chosenbar"><button class="back" id="backTheme">← 테마 다시 고르기</button></div>
    <div class="tip">
      <b>TIP</b>

  if(stains)for(let i=0;i<10;i++){const sx=Math.random()*S,g=x.createLinearGradient(0,0,0,S);g.addColorStop(0,'rgba(20,14,8,.35)');g.addColorStop(1,'rgba(20,14,8,0)');x.fillStyle=g;x.fillRect(sx,0,rnd(2,9),rnd(60,S));}
  x.strokeStyle='rgba(0,0,0,.45)';x.lineWidth=2;x.strokeRect(1,1,S-2,S-2);x.beginPath();x.moveTo(0,S/2);x.lineTo(S,S/2);x.stroke();

  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep[0],rep[1]);t.encoding=THREE.sRGBEncoding;t.anisotropy=4;return t;
}

{

}

    $('#cam').hidden=false;$('#camlbl').textContent='모델 불러오는 중';
    const V='0.5.1675469404';

    pose=new window.Pose({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@${V}/${f}`});

}

// arms in 3D. MediaPipe's depth guess alone is too noisy (a side arm read as "forward" and swung across the face), so:

const armTgt={L:null,R:null},armQ={L:new THREE.Quaternion(),R:new THREE.Quaternion()},armBend={L:.3,R:.3},boneLen={};let shoulderPx=0;

  padState.f=dy<-12?1:0;padState.b=dy>12?1:0;padState.l=dx<-12?1:0;padState.r=dx>12?1:0;});
const endJoy=e=>{if(!joy||e.pointerId!==joy.id)return;e.stopImmediatePropagation();joy.el.remove();joy=null;padState.f=padState.b=padState.l=padState.r=0;};
renderer.domElement.addEventListener('pointerup',endJoy);renderer.domElement.addEventListener('pointercancel',endJoy);
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,id:e.pointerId};try{renderer.domElement.setPointerCapture(e.pointerId);}catch(_){}});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;camYaw-=(e.clientX-drag.x)*.006;camH=clamp(camH+(e.clientY-drag.y)*.012,1.3,6.5);drag.x=e.clientX;drag.y=e.clientY;});
const endDrag=e=>{if(drag&&e.pointerId===drag.id)drag=null;};renderer.domElement.addEventListener('pointerup',endDrag);renderer.domElement.addEventListener('pointercancel',endDrag);
renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();camDist=clamp(camDist+e.deltaY*.004,3,10);},{passive:false});
let grainT=0,walkAmt=0,walkPh=0;
function frame(){
  const dt=Math.min(.05,clock.getDelta()),t=clock.elapsedTime;
  analyse();
  const beat=beatClock();
  pulse*=Math.pow(.02,dt);kickLight*=Math.pow(.002,dt);strobeLvl*=Math.pow(1e-7,dt); // sharp flash: a slow tail kept the dark hall grey between flashes
  shake*=Math.pow(.01,dt);
  const target=mode==='motion'&&tracked?bodyEnergy:.55+.25*pulse;
  energy=lerp(energy,target,.08);
  $('#fill').style.height=(energy*100).toFixed(1)+'%';

  // fire: flicker + flare on the kick
  fires.forEach((f,fi)=>{
    const flare=1+pulse*(.55+.6*energy)*(fi===0?1:.6);
    f.flames.forEach((m,i)=>{const ph=m.userData.ph;
      const n=.75+.18*Math.sin(t*9+ph)+.12*Math.sin(t*23+ph*2)+.08*Math.sin(t*41+ph*3);
      m.scale.set(.85+.15*Math.sin(t*7+ph),n*flare,.85+.15*Math.cos(t*6+ph));m.rotation.y+=dt*(1+i*.2);});
    // slow, layered flicker + eased kick swell: fast jumps made the floor light pop
    const fl=.9+.06*Math.sin(t*3.1+fi)+.04*Math.sin(t*5.3+fi*2);
    f.light.intensity=5*f.size*fl*(.5+1.8*kickLight); // snaps bright on the kick, gone within ~0.2 s: dark between hits
    f.glow.scale.setScalar(4*f.size*(.9+.1*fl)*(.75+.6*kickLight));f.glow.material.opacity=.55+.45*kickLight;
  });
  for(let i=0;i<EN;i++){const v=eV[i];eP[i*3+1]+=v.vy*dt*(1+pulse*1.5);eP[i*3]+=Math.sin(t*2+v.ph)*dt*.35;eP[i*3+2]+=Math.cos(t*1.7+v.ph)*dt*.35;if(eP[i*3+1]>v.top)resetEmber(i,false);}
  eG.attributes.position.needsUpdate=true;
  embers.material.size=.06+.04*pulse;djLamp.intensity=.3+2.2*kickLight;meters.forEach((m,i)=>m.color.setHex(kickLight>.2+i*.17?(i<2?0x3dff6a:0xff3d3d):0x111111));
  vinyls.forEach(v=>v.rotation.y-=dt*3.49); // 33⅓ rpm
  {const d=djScr-(vinyls.lastScr||0);vinyls.lastScr=djScr;vinyls[1].rotation.y+=d*1.6+dt*3.49*.85;} // the scratched record rocks with the DJ's hand
  { // club beams: scissor sweep up to ±65° (130° wide), lean toward the crowd, rainbow colour cycling nonstop, flare on the kick
    beams.forEach(b=>{b.head.rotation.z=b.side*1.134*Math.sin(t*.7);b.head.rotation.x=.28+.12*Math.sin(t*.6+b.side*1.3);
      const col=beamCol.setHSL((t*.1+(b.side>0?.08:0))%1,1,.55); // red→orange→yellow→green→blue→indigo→violet, one lap every 10 s
      b.mat.color.copy(col);b.glow.color.copy(col);b.lens.color.copy(col);
      b.mat.opacity=.5+.45*kickLight;b.glow.opacity=.5+.5*kickLight;});
  }
  leds.forEach((s,i)=>s.material.opacity=.5+.2*Math.sin(t*1.4+i*1.7)+(i%3===0?.4*kickLight:0)); // soft breathing glow, every third one flicks on the kick
  smoke.forEach(s=>{s.userData.t=(s.userData.t+dt*.06)%1;const k=s.userData.t;s.position.set(Math.sin(k*6+s.id)*.8*k,2+k*9,Math.cos(k*5+s.id)*.8*k);s.scale.setScalar(1.5+k*6);s.material.opacity=.35*Math.sin(k*Math.PI);});
  haze.forEach(s=>{const u=s.userData;s.position.x+=u.vx*dt;s.position.z+=u.vz*dt;if(Math.abs(s.position.x)>14)u.vx*=-1;if(s.position.z>15||s.position.z<-16)u.vz*=-1;s.material.opacity=.035+.02*Math.sin(t*.3+u.ph);});
  shafts.forEach((s,i)=>{s.material.opacity=.045+.015*Math.sin(t*.5+i);});
  { // strobe burst: 6 flashes of ~45 ms on 8th notes, hopping fixture to fixture. Between flashes the whole hall
    // drops to near-black (exposure, so fire, LEDs and beams go dark too), then the lights snap back after the burst
    const N=6,el=(performance.now()-strobeAt)/1000,step=SPB/2,k=Math.floor(el/step),burst=strobeOn&&el<N*step;
    const on=burst&&el%step<.045,fx=STROBES[(k+strobeSeq)%4];
    STROBES.forEach(s=>{const lit=on&&s===fx;s.lens.color.setHex(lit?0xffffff:0x222222);s.glow.opacity=lit?1:0;});
    if(on)strobe.position.copy(fx.g.position).y-=.4;
    strobe.intensity=on?22:0;
    renderer.toneMappingExposure=burst?(on?2.4:.025):EXPO;
    $('#flash').style.opacity=on?'.28':'0';
  }
  if((grainT+=dt)>.08){grainT=0;grain();}

  const ease=1-Math.exp(-dt*12); // frame-rate independent easing toward each dance pose
  // humans, not a drill team: own timing, slow look-arounds, a little sway and turn on the spot
  crowd.forEach(a=>{const d=autoDance(beat+a.lag,a.seed,a.inten*(.85+.15*Math.sin(t*.21+a.seed)),a.style);
    d.yaw=.38*Math.sin(t*.27+a.seed*2.3);d.lean+=.05*Math.sin(t*.6+a.seed);a.g.rotation.y=a.baseYaw+.25*Math.sin(t*.17+a.seed*1.7);blendPose(a.pose,a.mirror?mirrorPose(d):d,ease);applyPose(a,a.pose);});
  blendPose(dj.pose,djPose(beat),ease);applyPose(dj,dj.pose);

  if(mode==='motion'&&tracked){
    const tgt=Object.assign({},motionTarget),auto=autoDance(beat,0,1,0);
    tgt.bounce=Math.max(motionTarget.bounce,auto.bounce*clamp((energy-.2)*2.5,0,1.8)); // beat bounce only while you actually move
    tgt.nod=auto.nod*energy;tgt.spread=.12+.1*energy;tgt.fL=.15*energy;tgt.fR=.15*energy;
    blendPose(player.pose,tgt,1-Math.exp(-dt*20));
  }else blendPose(player.pose,autoDance(beat,0,.9),ease); // manual mode: no style → you cycle through all moves every 8 beats
  applyPose(player,player.pose);
  // tracked arms ease toward the camera pose (no per-frame snapping); torso lean is undone so the arm points where yours does
  const armsLive=mode==='motion'&&tracked;
  ['L','R'].forEach(s=>{const arm=player['arm'+s],tg=armTgt[s];
    if(!armsLive||!tg){armQ[s].copy(arm.a.quaternion);armBend[s]=arm.b.rotation.z;return;}
    const k=1-Math.exp(-dt*18);armQ[s].slerp(tg.q,k);armBend[s]=lerp(armBend[s],tg.bend,k);
    arm.a.quaternion.copy(player.torso.quaternion).invert().multiply(armQ[s]);arm.b.rotation.set(0,0,armBend[s]);});

  const f=(keys.w||keys.arrowup||padState.f?1:0)-(keys.s||keys.arrowdown||padState.b?1:0);
  const r=(keys.d||keys.arrowright||padState.r?1:0)-(keys.a||keys.arrowleft||padState.l?1:0);
  const sp=4*dt,pp=player.g.position;
  // keys move relative to where the camera looks (drag turns the camera, see camYaw)
  const cy=Math.cos(camYaw),sy=Math.sin(camYaw),mx=r*cy-f*sy,mz=-r*sy-f*cy;
  if(TH==='desert'){pp.x=clamp(pp.x+mx*sp,-24,24);pp.z=clamp(pp.z+mz*sp,-12.5,22);} // open sand, but stay on the flat (dunes start ~34 m out)
  else{pp.x=clamp(pp.x+mx*sp,-15,15);pp.z=clamp(pp.z+mz*sp,-12,17);
    const dc=Math.hypot(pp.x,pp.z);if(dc<2.8){pp.x*=2.8/(dc||1);pp.z*=2.8/(dc||1);}}  // don't walk into the fire
  // walking: turn to face where you're going and keep that heading when you stop (walk back with S to see your front), stride while moving
  const moving=f!==0||r!==0,turn=(want,rate)=>{const d=Math.atan2(Math.sin(want-player.g.rotation.y),Math.cos(want-player.g.rotation.y));player.g.rotation.y+=d*(1-Math.exp(-dt*rate));};
  walkAmt=lerp(walkAmt,moving?1:0,1-Math.exp(-dt*10));
  if(moving){walkPh+=sp*3.6;turn(Math.atan2(-mx,-mz),10);}
  if(walkAmt>.01)applyWalk(player,walkPh,walkAmt,!(mode==='motion'&&tracked));

  // speakers: louder and brighter up close, quieter and muffled across the hall
  if(spaceGain){
    const sd=Math.max(0,Math.min(...SPK[TH].map(([x,z])=>Math.hypot(pp.x-x,pp.z-z)))-3);
    const now=actx.currentTime;
    spaceGain.gain.setTargetAtTime(muted?0:.1+2.4*Math.exp(-sd/6),now,.1);
    spaceLP.frequency.setTargetAtTime(500+19500*Math.exp(-sd/8),now,.1);
    if(spacePan)spacePan.pan.setTargetAtTime(clamp(-pp.x/14,-.6,.6),now,.1);
  }

  camPos.lerp(_cv.set(pp.x+sy*camDist,camH,pp.z+cy*camDist),performance.now()<introUntil?1-Math.exp(-dt*1.1):.08); // orbit behind the player at camYaw / camDist / camH
  playerFill.position.set(pp.x,1.9,pp.z+1.6);
  cam.position.copy(camPos);
  if(!reduceMotion){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;}
  lookAt.set(pp.x-sy*3,TH==='desert'?2.3:1.5,pp.z-cy*3);cam.lookAt(lookAt); // desert: look a bit higher so the sky and sun are in frame

  if(TH==='desert'){ // sky rides with the camera; the sun's shadow box follows you; glare when you face the sun
    sky.position.copy(cam.position);sun.position.copy(pp).addScaledVector(SUN,60);sun.target.position.copy(pp);
    cones.forEach(c=>c.position.z=c.userData.z0+c.userData.ex*kickLight); // cones punch out on the kick
    { // gust envelope: ~2 s rise, a few seconds of blowing, ~3 s to settle; next one 12-28 s later
      const now=performance.now(),el=(now-gustAt)/1000;
      if(el>gustLen+5){gustAt=now+rnd(12000,28000);gustLen=rnd(3,6);}
      gust=el<0?0:el<2?el/2:el<2+gustLen?1:Math.max(0,1-(el-2-gustLen)/3);
      const g=gust*gust*(3-2*gust);
      clouds.forEach(c=>{c.position.x+=(1.5+16*g)*dt;if(c.position.x>pp.x+60)c.position.x-=120;c.material.opacity=.05+.32*g+.02*Math.sin(t*.4+c.userData.ph);});
      desertFog.near=lerp(120,4,g);desertFog.far=lerp(4200,220,g);
      $('#dusthaze').style.opacity=(.06+.34*g).toFixed(3);
      dust.material.opacity=.45+.4*g;dust.material.size=.035+.015*g;
      for(let i=0;i<DN;i++)dP[i*3]+=12*g*dt;
    }
    for(let i=0;i<DN;i++){dP[i*3]+=(1.2+2*pulse)*dt;dP[i*3+1]+=Math.sin(t*1.3+i)*dt*.15;if(dP[i*3]>30)dP[i*3]-=60;}dG.attributes.position.needsUpdate=true;
    puffs.forEach(s=>{const u=s.userData;if(u.age>1.4){s.material.opacity=0;return;}u.age+=dt;s.position.y+=dt*.35;s.scale.setScalar(.6+u.age*2.4);s.material.opacity=.45*(1-u.age/1.4);});
    cam.getWorldDirection(_fw);_sv.copy(SUN_VIS).multiplyScalar(400).add(cam.position).project(cam);
    const face=Math.max(0,_fw.dot(SUN_VIS)),gl=$('#glare');
    gl.style.setProperty('--gx',((_sv.x+1)*50).toFixed(1)+'%');gl.style.setProperty('--gy',(_sv.z<1?(1-_sv.y)*50:-80).toFixed(1)+'%');
    gl.style.opacity=(.42+.55*face**4).toFixed(3); // blinding when you face the sun
  }
  if(skins)skins.forEach(driveSkin);
  renderer.render(scene,cam);
  requestAnimationFrame(frame);
}
cam.position.copy(camPos);
frame();
})();
</script>
